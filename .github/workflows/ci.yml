name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fishstick
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fishstick"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/fishstick?sslmode=disable
      TEST_REQUIRE_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Unit tests
        run: go test -count=1 -race ./internal/... ./cmd/api ./test/config
      - name: Database integration tests
        run: >-
          go test -v -count=1 -race -timeout 10m
          -covermode=atomic -coverpkg=./... -coverprofile=coverage.out
          ./test/api ./test/database ./cmd/schedular
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: warn
