services:
  postgres:
    image: postgres:16-alpine
    container_name: fishstick-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fishstick
    ports:
      - "5432:5432"
    volumes:
      - fishstick_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d fishstick"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  fishstick_pgdata:
